<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 810" role="img" aria-labelledby="l1rt l1rd">
  <title id="l1rt">一条消息的两条路（L1：放大 L0 的 Intake 与 Eval）</title>
  <desc id="l1rd">已有工单的后续消息由该工单的执行器自己裁决，不经 Eval；其余消息先过纯代码的 Gate 得到强度，再交给路由 LLM。LLM 永远拿不到 Gate 之外的授权，主动发现的工作在 observe 模式下只记录不动手。</desc>
  <style>
    svg { --bg:#ffffff; --ink:#1f2328; --muted:#57606a; --code-fill:#f6f8fa; --code-stroke:#24292f; --llm-fill:#fff4e5; --llm-stroke:#b35900;
          --ext-fill:#eef6ff; --ext-stroke:#0969da; --edge:#424a53; --accent:#cf222e; --dec-fill:#ffffff;
          font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Source Han Sans SC", "Microsoft YaHei", "WenQuanYi Zen Hei", sans-serif; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#0d1117; --ink:#e6edf3; --muted:#9da7b3; --code-fill:#161b22; --code-stroke:#c9d1d9; --llm-fill:#2b1d0c; --llm-stroke:#f0a14a;
            --ext-fill:#0c2340; --ext-stroke:#58a6ff; --edge:#adbac7; --accent:#ff7b72; --dec-fill:#0d1117; }
    }
    .bg { fill: var(--bg); }
    .code { fill: var(--code-fill); stroke: var(--code-stroke); stroke-width: 1.5; }
    .gate { fill: var(--code-fill); stroke: var(--code-stroke); stroke-width: 3; }
    .rec { fill: none; stroke: var(--muted); stroke-width: 1.3; stroke-dasharray: 5 4; }
    .dec { fill: var(--dec-fill); stroke: var(--code-stroke); stroke-width: 1.5; }
    .llm { fill: var(--llm-fill); stroke: var(--llm-stroke); stroke-width: 1.5; }
    .llm2 { fill: none; stroke: var(--llm-stroke); stroke-width: 1; }
    .ext { fill: var(--ext-fill); stroke: var(--ext-stroke); stroke-width: 1.5; }
    .t { fill: var(--ink); font-size: 14.5px; font-weight: 600; }
    .s { fill: var(--muted); font-size: 12.5px; }
    .lab { fill: var(--ink); font-size: 12.5px; font-weight: 600; }
    .labA { fill: var(--accent); font-size: 12.5px; font-weight: 600; }
    .e { stroke: var(--edge); stroke-width: 1.6; fill: none; marker-end: url(#arr); }
    .eb { stroke: var(--accent); stroke-width: 2; fill: none; stroke-dasharray: 2 4 10 4; marker-end: url(#arrA); }
    .ah { fill: var(--edge); } .ahA { fill: var(--accent); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ahA" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="980" height="810"/>

  <!-- Start -->
  <rect class="ext" x="370" y="14" width="260" height="44" rx="22"/>
  <text class="t" x="500" y="41" text-anchor="middle">外部消息 → Trigger</text>
  <path class="e" d="M500,58 L500,78"/>

  <!-- D1 -->
  <polygon class="dec" points="350,118 500,80 650,118 500,156"/>
  <text class="t" x="500" y="123" text-anchor="middle">Source 在听这个会话吗？</text>
  <path class="e" d="M650,118 L718,118"/>
  <text class="lab" x="684" y="110" text-anchor="middle">否</text>
  <rect class="rec" x="720" y="94" width="240" height="48"/>
  <text class="t" x="840" y="115" text-anchor="middle">filtered</text>
  <text class="s" x="840" y="133" text-anchor="middle">记原因码，不进入领域</text>
  <path class="e" d="M500,156 L500,184"/>
  <text class="lab" x="510" y="175">是</text>

  <!-- B1 -->
  <rect class="code" x="300" y="186" width="400" height="56"/>
  <text class="t" x="500" y="208" text-anchor="middle">Intake：同 id 只存一次</text>
  <text class="s" x="500" y="228" text-anchor="middle">扇出给订阅该 Thread 的活工单（作为 Input）</text>
  <path class="e" d="M500,242 L500,256"/>

  <!-- D2 -->
  <polygon class="dec" points="300,300 500,258 700,300 500,342"/>
  <text class="t" x="500" y="296" text-anchor="middle">人的消息，且落在</text>
  <text class="t" x="500" y="315" text-anchor="middle">某工单自己的 Thread 上？</text>

  <!-- Yes branch: worker decides -->
  <path class="eb" d="M300,300 L272,300"/>
  <text class="labA" x="287" y="284" text-anchor="middle">是</text>
  <rect class="llm" x="20" y="256" width="250" height="88" rx="12"/>
  <rect class="llm2" x="24" y="260" width="242" height="80" rx="9"/>
  <text class="t" x="145" y="282" text-anchor="middle">该工单的执行器自己裁决</text>
  <text class="labA" x="145" y="302" text-anchor="middle">零 Eval</text>
  <text class="s" x="145" y="320" text-anchor="middle">主 Session 只收 follow_up 通知，</text>
  <text class="s" x="145" y="336" text-anchor="middle">对它只能发起 stop</text>
  <path class="e" d="M90,344 L80,378"/>
  <path class="e" d="M200,344 L210,378"/>
  <rect class="llm" x="20" y="380" width="118" height="58" rx="10"/>
  <text class="t" x="79" y="404" text-anchor="middle">范围内</text>
  <text class="s" x="79" y="424" text-anchor="middle">ack，接着做</text>
  <rect class="llm" x="150" y="380" width="120" height="58" rx="10"/>
  <text class="t" x="210" y="404" text-anchor="middle">超出范围</text>
  <text class="s" x="210" y="424" text-anchor="middle">handback 一次</text>
  <path class="e" d="M270,409 L328,409"/>
  <text class="lab" x="299" y="400" text-anchor="middle">带理由</text>

  <!-- No branch: eval queue -->
  <path class="e" d="M500,342 L500,378"/>
  <text class="lab" x="510" y="365">否（含所有 bot / CI 消息）</text>
  <rect class="code" x="330" y="380" width="380" height="58"/>
  <text class="t" x="520" y="403" text-anchor="middle">进入主 Thread 的 Eval 队列</text>
  <text class="s" x="520" y="423" text-anchor="middle">同一 Thread 同时只跑一个 Eval，期间到达的并入下一批</text>
  <path class="e" d="M520,438 L520,472"/>

  <!-- Gate -->
  <rect class="gate" x="330" y="474" width="380" height="62"/>
  <text class="t" x="520" y="498" text-anchor="middle">Gate（纯代码，不问模型）</text>
  <text class="s" x="520" y="520" text-anchor="middle">名单 × 是否 @ 机器人 × 准入表 × 接单模式 → 强度</text>

  <!-- Outcomes -->
  <path class="e" d="M360,536 L200,588"/>
  <text class="lab" x="250" y="556" text-anchor="middle">不准入</text>
  <rect class="rec" x="20" y="590" width="250" height="58"/>
  <text class="t" x="145" y="614" text-anchor="middle">ignore</text>
  <text class="s" x="145" y="634" text-anchor="middle">记原因码，如 not_a_member</text>

  <path class="e" d="M470,536 L430,586"/>
  <text class="lab" x="420" y="566" text-anchor="end">explicit</text>
  <rect class="llm" x="300" y="588" width="250" height="70" rx="12"/>
  <rect class="llm2" x="304" y="592" width="242" height="62" rx="9"/>
  <text class="t" x="425" y="612" text-anchor="middle">主 Session：orchestrator_route</text>
  <text class="s" x="425" y="632" text-anchor="middle">accept · attach · stop · ignore</text>
  <text class="s" x="425" y="648" text-anchor="middle">一次调用可批量 1–20 条</text>

  <path class="e" d="M600,536 L700,586"/>
  <text class="lab" x="668" y="556">inferred（模式 ≠ off）</text>
  <rect class="llm" x="580" y="588" width="380" height="70" rx="12"/>
  <rect class="llm2" x="584" y="592" width="372" height="62" rx="9"/>
  <text class="t" x="770" y="612" text-anchor="middle">主 Session 研判：orchestrator_eval</text>
  <text class="s" x="770" y="632" text-anchor="middle">读有界窗口与截图，每条启用规则判一次</text>
  <text class="s" x="770" y="648" text-anchor="middle">必须给出 direction 与 intent_evidence</text>

  <!-- Bottom row -->
  <path class="e" d="M425,658 L425,700"/>
  <text class="lab" x="435" y="684">accept</text>
  <rect class="code" x="250" y="702" width="320" height="68"/>
  <text class="t" x="410" y="726" text-anchor="middle">一个事务内建好：</text>
  <text class="s" x="410" y="746" text-anchor="middle">Ticket + 不可变 Mandate + 订阅</text>
  <text class="s" x="410" y="762" text-anchor="middle">+ 待启动派工 + 排队的确认消息</text>

  <path class="e" d="M680,658 L680,700"/>
  <text class="lab" x="690" y="684">observe</text>
  <rect class="rec" x="590" y="702" width="180" height="68"/>
  <text class="t" x="680" y="728" text-anchor="middle">记 ignore</text>
  <text class="s" x="680" y="748" text-anchor="middle">+ would_accept，不动手</text>

  <path class="e" d="M870,658 L870,700"/>
  <text class="lab" x="880" y="684">auto</text>
  <rect class="code" x="780" y="702" width="180" height="68"/>
  <text class="t" x="870" y="728" text-anchor="middle">同左 accept</text>
  <text class="s" x="870" y="748" text-anchor="middle">Mandate 记下匹配规则</text>

  <text class="s" x="20" y="798">方角 = 代码 · 双线圆角 = LLM · 虚线框 = 只记录、不动手 · 红色点划线 = 绕过 Eval 的那条路</text>
</svg>
